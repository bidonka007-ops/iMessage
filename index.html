<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>iMessage bus ticket</title>
    <link rel="stylesheet" href="style.css" />

    <!-- Связь с манифестом PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#f3f3f5">

    <!-- Специальные теги для установки на iOS (iPhone) -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Ticket">
    <link rel="apple-touch-icon" href="icon-192.png">
  </head>
  <body>
    <div class="app-shell">
      <div class="phone-screen">
        <header class="topbar" aria-label="Шапка чата">
          <button class="nav-btn" type="button" aria-label="Назад">‹</button>

          <div class="avatar-wrap" aria-label="Аватар пользователя">
            <div class="avatar-ring" aria-label="Аватар пользователя">
              <img class="avatar-image" src="assets/avatar.png" alt="Аватар пользователя" />
            </div>
            <div class="balance-badge">7000</div>
          </div>
        </header>

        <main class="messages" id="messages" aria-live="polite" aria-label="Диалог"></main>

        <footer class="composer" aria-label="Поле ввода">
          <button class="add-btn" type="button" aria-label="Добавить">+</button>

          <form id="message-form" class="composer-form" autocomplete="off">
            <label class="sr-only" for="board-input">Номер транспорта</label>
            <input
              id="board-input"
              name="boardNumber"
              type="text"
              inputmode="numeric"
              maxlength="6"
              pattern="[0-9]*"
              placeholder="Текстовое сообщение • SMS"
              aria-label="Введите номер транспорта"
            />
            <button class="send-btn" type="submit" aria-label="Отправить">➤</button>
          </form>
        </footer>
      </div>
    </div>

    <script src="script.js"></script>

    <!-- Регистрация Service Worker для PWA -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(registration => {
              console.log('ServiceWorker успешно зарегистрирован:', registration.scope);
            })
            .catch(err => {
              console.log('Ошибка при регистрации ServiceWorker:', err);
            });
        });
      }
    </script>
  </body>
</html>
