<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>iMessage bus ticket</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="app-shell">
      <div class="phone-screen">
        <header class="topbar" aria-label="Шапка чата">
          <button class="nav-btn" type="button" aria-label="Назад">‹</button>

          <div class="avatar-wrap" aria-label="Аватар пользователя">
            <div class="avatar-ring" aria-label="Аватар пользователя">
              <img class="avatar-image" src="assets/avatar.png" alt="Аватар пользователя" />
            </div>
            <div class="balance-badge">7000</div>
          </div>
        </header>

        <main class="messages" id="messages" aria-live="polite" aria-label="Диалог"></main>

        <footer class="composer" aria-label="Поле ввода">
          <button class="add-btn" type="button" aria-label="Добавить">+</button>

          <form id="message-form" class="composer-form" autocomplete="off">
            <label class="sr-only" for="board-input">Номер транспорта</label>
            <input
              id="board-input"
              name="boardNumber"
              type="text"
              inputmode="numeric"
              maxlength="6"
              pattern="[0-9]*"
              placeholder="Текстовое сообщение • SMS"
              aria-label="Введите номер транспорта"
            />
            <button class="send-btn" type="submit" aria-label="Отправить">➤</button>
          </form>
        </footer>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
